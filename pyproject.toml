[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetweave-agent"
version = "0.1.0"
description = "Transform structured business data into template-governed, traceable and reviewable Word documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Flask==3.1.3", "gunicorn==26.2.0", "openpyxl==3.1.5"]

[project.scripts]
sheetweave-agent = "sheetweave_agent.cli:main"
sheetweave-web = "sheetweave_agent.web:main"
sheetweave-worker = "sheetweave_agent.task_worker:main"
sheetweave-server = "sheetweave_agent.server:main"

[tool.setuptools]
packages = ["sheetweave_agent", "sheetweave_agent.llm", "sheetweave_agent.rules"]
package-dir = {sheetweave_agent = "src"}

[tool.setuptools.package-data]
sheetweave_agent = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg", "rules/*.json", "examples/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["sheetweave_agent"]
